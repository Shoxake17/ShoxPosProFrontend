# Xavfsizlik sarlavhalari — frontend javoblari uchun (AUD-6/AUD-7, 2026-11-12).
#
# ┌─ NEGA ALOHIDA FAYL VA HAR LOCATION'DA `include` ──────────────────────┐
# nginx'da location ichida BITTA bo'lsa ham `add_header` yozilsa, server
# darajasidagi barcha `add_header` lar o'sha location'ga MEROS BO'LMAYDI.
# Avvalgi prod konfigida `/assets/` dagi Cache-Control aynan shunday qilib
# sarlavhalarni yo'qotgan edi. Shuning uchun ro'yxat bitta joyda va har bir
# frontend location'ida include qilinadi.
#
# HSTS bu yerda YO'Q: uni tashqi proksi (Caddy/Cloudflare) beradi — ikki
# marta yuborilsa sarlavha takrorlanadi.
# /api/ va /socket.io/ ga ulanmaydi: backend (helmet) o'z sarlavhalarini beradi.
# └────────────────────────────────────────────────────────────────────────┘

# CSP: script-src faqat 'self' — build'da inline skript ham, eval ham yo'q.
# connect-src — faqat haqiqatan ishlatiladiganlar: OnDex (API, socket.io),
# valyuta kursi (cbu.uz). Yangi tashqi manba = shu ro'yxatga qo'shish.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://*.ondex.uz wss://*.ondex.uz https://cbu.uz; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Resource-Policy "same-site" always;
