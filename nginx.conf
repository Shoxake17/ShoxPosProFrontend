# OnDex Merchant web (ShoxPos frontend) — YAGONA nginx konfiguratsiyasi.
#
# ┌─ 2026-11-12 (AUD-6, Plane 304) ───────────────────────────────────────┐
# Prod compose ilgari `./default.conf` ni shu fayl ustiga ulab qo'yardi va
# unda xavfsizlik sarlavhalari umuman yo'q edi — git'dagi CSP hech qachon
# ishlamagan. Endi prod'dagi xatti-harakat (server_tokens off, /assets
# keshi, backend manzili) shu yerga ko'chirildi va compose'dagi ulash olib
# tashlanadi: konfig faqat git orqali, CI tekshiruvi bilan o'zgaradi.
# └────────────────────────────────────────────────────────────────────────┘
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # Vite build fayllari — nomida xesh bor, abadiy keshlanadi.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA kirish nuqtasi va service worker — HAR DOIM yangisi tekshirilsin,
    # aks holda deploy'dan keyin eski chunk'lar so'raladi.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # API — backend konteyneri (helmet o'z sarlavhalarini beradi).
    location /api/ {
        proxy_pass http://shoxpospro-backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io (real vaqt).
    location /socket.io/ {
        proxy_pass http://shoxpospro-backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
