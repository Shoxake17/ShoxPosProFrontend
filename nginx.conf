server {
    listen 80;
    server_name shoxpospro.uz;

    # --- XAVFSIZLIK SARLAVHALARI (ZAP WARNINGLARINI YOPISH UCHUN) ---
    # 1. HSTS - HTTPS-ni majburiy qilish
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 2. CSP - Skriptlar va rasm manbalarini cheklash (AUD-7, 2026-11-10)
    # script-src faqat 'self': build'da inline skript ham, eval ham yo'q
    # (tekshirilgan). connect-src - faqat haqiqatan ishlatiladiganlar:
    # OnDex (API, socket.io), valyuta kursi (cbu.uz). Ishlatilmaydigan
    # supabase, jsdelivr, freeipapi, ipapi.co, AI API'lari olib tashlandi. Yangi tashqi manba = shu ro'yxatga qo'shish.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://*.ondex.uz wss://*.ondex.uz https://cbu.uz; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # 3. Permissions Policy - Kamera/Mikrofonni cheklash
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # 4. Boshqa standart xavfsizlik qatlamlari
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    # -------------------------------------------------------------

    # 1. Frontend (React/Vite) fayllari uchun
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. API so'rovlarini BACKEND konteyneriga yo'naltirish
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Socket.io (Real-time ulanish)
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}