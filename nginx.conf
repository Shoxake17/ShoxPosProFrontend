server {
    listen 80;
    server_name shoxpospro.uz;

    # --- XAVFSIZLIK SARLAVHALARI (ZAP WARNINGLARINI YOPISH UCHUN) ---
    # 1. HSTS - HTTPS-ni majburiy qilish
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 2. CSP - Skriptlar va rasm manbalarini cheklash
    # ShoxPay va tashqi API'lar ishlashi uchun connect-src va img-src ruxsat berilgan
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' ws: wss: *.ondex.uz https://*.ondex.uz https://*.supabase.co https://cdn.jsdelivr.net https://freeipapi.com https://ipapi.co https://flagcdn.com https://api.anthropic.com https://generativelanguage.googleapis.com https://api.x.ai https://cbu.uz" always;

    # 3. Permissions Policy - Kamera/Mikrofonni cheklash
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # 4. Boshqa standart xavfsizlik qatlamlari
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    # -------------------------------------------------------------

    # 1. Frontend (React/Vite) fayllari uchun
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. API so'rovlarini BACKEND konteyneriga yo'naltirish
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Socket.io (Real-time ulanish)
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}