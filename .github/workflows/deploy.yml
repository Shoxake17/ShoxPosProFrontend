name: CI/CD & Security Scan

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u shoxake17 --password-stdin

      - name: Build & Push Frontend (No Cache)
        run: |
          docker build --no-cache -t ghcr.io/shoxake17/shoxposprofrontend:latest .
          docker push ghcr.io/shoxake17/shoxposprofrontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # Build tugashini kutadi
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.OWASP_ZAP_SSH_KEY }}
          script: |
            cd ~/shoxpospro
            docker-compose pull frontend
            docker-compose up -d --no-deps --force-recreate frontend

  zap_scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: deploy # FAQAT Deploy tugagandan keyin ishlaydi
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix permissions
        run: chmod -R 777 $GITHUB_WORKSPACE

      - name: Run OWASP ZAP Full Scan
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw zaproxy/zap-stable \
            zap-full-scan.py -t https://shoxpospro.uz \
            -r zap_report.html \
            -J zap_report.json \
            -m 5 || true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-html-report
          path: zap_report.html