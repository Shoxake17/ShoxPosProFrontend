name: ShoxPosProFrontend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync to Project Folder
        run: |
          rsync -avz --delete --exclude '.env' --exclude 'node_modules' --exclude '.git' --exclude 'dist' ./ ~/projects/ShoxPosProFrontend/

      - name: Build Project
        run: |
          cd ~/projects/ShoxPosProFrontend
          
          # 1. ARVOH DEPENDENCY-NI O'CHIRISH (Jarrohlik amaliyoti)
          # Bu buyruq package.json ichidan dataconnect qatorini qidirib topadi va o'chiradi
          sed -i '/dataconnect-generated/d' package.json
          
          # 2. Tozalash
          rm -rf node_modules package-lock.json
          
          # 3. Toza o'rnatish (Audit-siz tezroq ishlaydi)
          npm install --no-audit
          
          # 4. Rollup va Build
          npm install @rollup/rollup-linux-x64-gnu
          npm run build

      - name: Copy Build to Web Root
        run: |
          sudo rsync -avz --delete ~/projects/ShoxPosProFrontend/dist/ /var/www/shoxpospro/