name: CI/CD & Security Scan - ShoxPosPro Frontend

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  # 1. SAST — Statik tahlil
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/javascript \
            --config=p/react \
            --config=p/typescript \
            --sarif \
            --output=semgrep.sarif \
            . || true

          if [ ! -f semgrep.sarif ]; then
            echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Semgrep","rules":[]}},"results":[]}]}' > semgrep.sarif
          fi

      - name: Check for Critical vulnerabilities
        run: |
          CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          echo "🔴 Critical: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Critical zaifliklar topildi — pipeline to'xtatildi!"
            exit 1
          fi

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # 2. Build va Push
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u shoxake17 --password-stdin

      - name: Build & Push Frontend
        run: |
          docker build --no-cache -t ghcr.io/shoxake17/shoxposprofrontend:latest .
          docker push ghcr.io/shoxake17/shoxposprofrontend:latest

  # 3. Deploy
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.OWASP_ZAP_SSH_KEY }}
          script: |
            cd ~/shoxpospro
            docker-compose pull frontend
            docker-compose up -d --no-deps --force-recreate frontend

  # 4. DAST — Dinamik tahlil
  zap_scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix permissions
        run: chmod -R 777 $GITHUB_WORKSPACE

      - name: Run OWASP ZAP Full Scan
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw zaproxy/zap-stable \
            zap-full-scan.py -t https://shoxpospro.uz \
            -r zap_report.html \
            -J zap_report.json \
            -m 5 || true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-html-report
          path: |
            zap_report.html
            zap_report.json