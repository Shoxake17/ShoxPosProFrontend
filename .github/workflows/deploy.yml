name: CI/CD & Security Scan - ShoxPosPro Frontend

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  # 1. Semgrep — Har bir pushda xavfsizlikni tekshiradi
  semgrep_sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Full Scan
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/javascript \
            --config=p/react \
            --config=p/typescript \
            --sarif \
            --output=semgrep.sarif \
            . || true

      - name: Check for Critical Issues
        run: |
          CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          echo "🔴 Critical Security Issues: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Kritik zaiflik topildi! Pipeline to'xtatiladi."
            exit 1
          fi

      - name: Upload Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # 2. SonarCloud — Kod sifatini va chuqur tahlilni amalga oshiradi
  sonarcloud_sast:
    name: SAST - SonarCloud
    runs-on: ubuntu-latest
    needs: semgrep_sast
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: SonarCloud Analysis
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          -Dsonar.organization=shoxake17
          -Dsonar.projectKey=ShoxPosProFrontend
          -Dsonar.sources=.
          -Dsonar.host.url=https://sonarcloud.io
  # 3. Build va Push
  build-and-push:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    needs: [semgrep_sast, sonarcloud_sast]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u shoxake17 --password-stdin

      - name: Build and Push
        run: |
          docker build --no-cache -t ghcr.io/shoxake17/shoxposprofrontend:latest .
          docker push ghcr.io/shoxake17/shoxposprofrontend:latest

  # 4. Deploy
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploying via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.OWASP_ZAP_SSH_KEY }}
          script: |
            cd ~/shoxpospro
            docker-compose pull frontend
            docker-compose up -d --no-deps --force-recreate frontend

  # 5. DAST — OWASP ZAP (Tunda ishlaydi)
  zap_scan:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ZAP Scan
        run: |
          chmod -R 777 $GITHUB_WORKSPACE
          docker run --rm -v $(pwd):/zap/wrk/:rw zaproxy/zap-stable \
            zap-full-scan.py -t https://shoxpospro.uz -r zap_report.html -J zap_report.json || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-reports
          path: zap_report.*