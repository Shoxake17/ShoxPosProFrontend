name: CI/CD & Security Scan - ShoxPosPro Frontend

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  # 0. Gitleaks — Secrets Scanning (Frontend build fayllarida kalitlar yo'qligini tekshiradi)
  gitleaks_scan:
    name: Secrets - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tarixni to'liq skanerlash uchun

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 1. Semgrep — Har bir pushda xavfsizlikni tekshiradi
  semgrep_sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: gitleaks_scan
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep Full Scan
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/javascript \
            --config=p/react \
            --config=p/typescript \
            --sarif \
            --output=semgrep.sarif \
            . || true

      - name: Check for Critical Issues
        run: |
          CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif)
          echo "🔴 Critical Security Issues: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Kritik zaiflik topildi! Pipeline to'xtatiladi."
            exit 1
          fi

      - name: Upload Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # 2. Snyk - Barcha pakerlar uchun zaifliklarni tekshiradi
  snyk_sca:
    name: SCA - Snyk
    runs-on: ubuntu-latest
    needs: semgrep_sast
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Snyk Test
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # 3. SonarCloud — Kod sifatini va chuqur tahlilni amalga oshiradi
  sonarcloud_sast:
    name: SAST - SonarCloud
    runs-on: ubuntu-latest
    needs: semgrep_sast
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: SonarCloud Analysiss
        # v6+ (GHSA-5xq9-5g24-4g6f, GHSA-f79p-9c5r-xg88 - v5.x da HIGH; backend bilan bir xil)
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=shoxake17
            -Dsonar.projectKey=Shoxake17_ShoxPosProFrontend
            -Dsonar.sources=.
            -Dsonar.host.url=https://sonarcloud.io

  # 4. Build va Push
  build-and-push:
    name: Build and Push Docker
    runs-on: ubuntu-latest
    needs: [semgrep_sast, sonarcloud_sast, snyk_sca]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u shoxake17 --password-stdin

      # 1. Build (Lokal skanerlash uchun imajni yaratamiz)
      - name: Build Docker Image
        run: docker build --no-cache -t ghcr.io/shoxake17/shoxposprofrontend:latest .

      # 2. Scan (Trivy konteyner ichidagi OS zaifliklarini tekshiradi)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/shoxake17/shoxposprofrontend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 2b. nginx konfiguratsiyasi va xavfsizlik sarlavhalari (AUD-6, 2026-11-12).
      # Ilgari prod'dagi eski default.conf git'dagi CSP'ni jimgina yopib qo'ygan
      # edi. Endi image o'zi tekshiriladi: sarlavha yo'qolsa deploy bo'lmaydi.
      - name: nginx -t va xavfsizlik sarlavhalari
        run: |
          set -euo pipefail
          IMG=ghcr.io/shoxake17/shoxposprofrontend:latest
          docker run --rm --add-host shoxpospro-backend:127.0.0.1 "$IMG" nginx -t
          docker run -d --name fe-test --add-host shoxpospro-backend:127.0.0.1 -p 8088:80 "$IMG"
          trap 'docker rm -f fe-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://localhost:8088/ && break; sleep 0.5; done
          ASSET=$(curl -fsS http://localhost:8088/ | grep -oE '/assets/[^"]+\.js' | head -1)
          test -n "$ASSET" || { echo "::error::index.html da /assets/*.js topilmadi"; exit 1; }
          for P in / /index.html /ichki/sahifa "$ASSET"; do
            H=$(curl -fsS -D - -o /dev/null "http://localhost:8088$P")
            for N in content-security-policy x-content-type-options x-frame-options referrer-policy; do
              echo "$H" | grep -qi "^$N:" || { echo "::error::$P javobida $N yo'q"; exit 1; }
            done
            echo "$H" | grep -qi '^server: nginx/' && { echo "::error::$P nginx versiyasini oshkor qiladi"; exit 1; }
            echo "OK $P"
          done
          curl -fsS -D - -o /dev/null "http://localhost:8088$ASSET" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          curl -fsS -D - -o /dev/null "http://localhost:8088/index.html" | grep -qi 'cache-control: no-cache'

      # 3. Push (Faqat skanerlash muvaffaqiyatli bo'lsa)
      - name: Push Docker Image
        run: docker push ghcr.io/shoxake17/shoxposprofrontend:latest

  # 5. Deploy
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploying via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.OWASP_ZAP_SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_TOKEN
          # ┌─ NEGA LOGIN VA set -e (2026-11-08) ─────────────────────────────┐
          # GHCR image'i yopiq. Login'siz `pull` rad etilardi, `up` esa JIMGINA
          # lokaldagi eski image bilan qayta ishga tushardi — CI "success",
          # production esa 2026-09-18 build'ida qolib ketgan edi. Endi pull
          # yiqilsa deploy ham yiqiladi. Token jarayonlar ro'yxatiga tushmasin
          # — --password-stdin.
          # └─────────────────────────────────────────────────────────────────┘
          script: |
            set -euo pipefail
            cd ~/shoxpospro
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u shoxake17 --password-stdin
            docker-compose pull frontend
            docker-compose up -d --no-deps --force-recreate frontend
            docker logout ghcr.io