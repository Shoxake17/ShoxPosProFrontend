name: Deploy Frontend

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to GHCR
      run: echo ${{ secrets.GHCR_PAT }} | docker login ghcr.io -u shoxake17 --password-stdin

    - name: Build Frontend Image
      run: docker build -t ghcr.io/shoxake17/shoxposprofrontend:latest .

    - name: Push Frontend Image
      run: docker push ghcr.io/shoxake17/shoxposprofrontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd ~/shoxpospro
          docker-compose pull frontend
          docker-compose up -d --no-deps --force-recreate frontend
