name: ShoxPosProFrontend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync to Projects Folder
        run: |
          # Runner papkasidagi kodni asosiy projects papkasiga nusxalash
          rsync -avz --delete --exclude '.env' --exclude 'node_modules' --exclude '.git' --exclude 'dist' ./ ~/projects/ShoxPosProFrontend/

      - name: Deploy with Docker Compose
        run: |
          cd ~/projects
          
          # 1. Konteyner ichida xato bermasligi uchun package.json ni tozalash
          sed -i '/dataconnect-generated/d' ./ShoxPosProFrontend/package.json || true
          
          # 2. Faqat Frontend konteynerini qayta qurish (rebuild)
          # Bu Dockerfile-dagi Stage 1 (Build) va Stage 2 (Nginx) ni ishga tushiradi
          docker compose build frontend
          
          # 3. Frontend konteynerini yangilash
          docker compose up -d frontend
          
          # 4. Keraksiz (eski) imidjlarni o'chirish (disk joyini tejash uchun)
          docker image prune -f