name: ShoxPosProFrontend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync to Projects Folder
        run: |
          # Runner papkasidagi kodni asosiy projects papkasiga nusxalash
          # --delete bayrog'i o'chirilgan fayllarni serverdan ham o'chiradi
          rsync -avz --delete --exclude '.env' --exclude 'node_modules' --exclude '.git' --exclude 'dist' ./ ~/projects/ShoxPosProFrontend/

      - name: Deploy with Docker Compose
        run: |
          cd ~/projects
          
          # 1. "Ghost" dependency xatosini oldini olish (Jarrohlik)
          sed -i '/dataconnect-generated/d' ./ShoxPosProFrontend/package.json || true
          
          # 2. Faqat Frontend imidjini qayta qurish
          # Bu jarayon Dockerfile ichidagi Node 20 va Alpine bosqichlarini ishlatadi
          docker compose build frontend
          
          # 3. KONFLIKTNI OLIDINI OLISH VA YANGILASH
          # --no-deps: Backend konteynerini qayta tekshirmaydi va unga tegmaydi
          # --force-recreate: Eskisini o'chirib, yangi imidjdan yangi konteyner yaratadi
          docker compose up -d --no-deps --force-recreate frontend
          
          # 4. Tozalash (Diskni eski imidjlardan bo'shatish)
          docker image prune -f